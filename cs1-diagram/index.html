  const t=mk('p','lens',id===D.purpose?'At the center':n.lens+' lens');t.style.color=id===D.purpose?'#111':css(n.lens);
  const parts=[t,mk('h3','',n.label)];
  const sb=mk('div','steps');sb.append(mk('span','','Steps back'));
  [1,2,3].forEach(k=>sb.append(btn(k===steps?'on':'',k+' ('+(Object.keys(upstream(id,k)).length-1)+')',()=>gather(id,k))));parts.push(sb);
  parts.push(btn('act draw','Draw as a small diagram',()=>openSolo(selTitle,G.sel.nodes,G.sel.edges,G.sel.hl2,G.sel.sink)));
  parts.push(btn('act','Back to the full map',()=>{ungather();G.reset();hide()}));
  const maxd=Math.max(...Object.values(dist));
  if(!maxd)parts.push(mk('p','note','Nothing in the diagram pushes this box.'));
  for(let d=1;d<=maxd;d++){const ring=Object.keys(dist).filter(v=>dist[v]===d);
    parts.push(mk('p','ih',(d===1?'1 step back':d+' steps back')+' ('+ring.length+')'));const u=mk('ul');
    ring.forEach(v=>{if(d===1){u.append(arrowItem(D.edges.find(e=>e.a===v&&e.b===id),v));return}
      const it=pick(lab(v),()=>selectNode(v,true));
      it.append(mk('span','why','into '+D.edges.filter(e=>e.a===v&&dist[e.b]===d-1).map(e=>(e.s==='+'?'+ ':'− ')+lab(e.b)).join(' · ')));u.append(it)});
    parts.push(u)}
  parts.push(mk('p','note','Each ring is one more step back. Thick arrows step toward the middle; thin arrows run between boxes already gathered.'));
  show(parts)}
function selectNode(id,center){if(gathered&&!gathered.set.has(id))ungather(false);clearSels(findBox);
  const ins=D.edges.filter(e=>e.b===id),outs=D.edges.filter(e=>e.a===id);
  G.paths(ins.map(e=>[e.a,id]),outs.map(e=>[id,e.b]));selTitle=lab(id);
  const n=byId[id];const L=mk('p','lens',id===D.purpose?'At the center':n.lens+' lens');L.style.color=id===D.purpose?'#111':css(n.lens);const parts=[L,mk('h3','',n.label)];
  parts.push(btn('act','Gather what leads into it',()=>gather(id,0)));
  if(gathered){const g0=gathered;parts.push(btn('act','Back to '+lab(g0.id),()=>gather(g0.id,g0.steps)))}
  parts.push(mk('p','ih','Pushed by ('+ins.length+') · dark arrows'));const u1=mk('ul');ins.forEach(e=>u1.append(arrowItem(e,e.a)));parts.push(u1);
  parts.push(mk('p','ih','Pushes ('+outs.length+') · red arrows'));const u2=mk('ul');outs.forEach(e=>u2.append(arrowItem(e,e.b)));parts.push(u2);
  show(parts);if(center)centerOn([id])}
Object.entries(G.Nn).forEach(([id,o])=>{o.g.style.cursor='pointer';o.g.setAttribute('data-tip',o.g.getAttribute('data-tip')+'\nClick to see its arrows');o.g.addEventListener('click',()=>selectNode(id,false))});
// lens: its boxes; red frames = its three purposes
LENS6.forEach(L=>lensSel.append(new Option(L,L)));
lensSel.onchange=()=>{ungather();const L=lensSel.value;clearSels(lensSel);if(!L){G.reset();hide();return}
  const gs=D.goals[L];G.subset([...new Set(D.nodes.filter(n=>n.lens===L).map(n=>n.id).concat(gs))]);gs.forEach(id=>G.Nn[id].g.classList.add('hi'));selTitle=L+' lens';
  const t=mk('p','lens',L+' lens');t.style.color=css(L);const u=mk('ul');gs.forEach(g=>u.append(pick(lab(g),()=>gather(g,0))));
  show([t,mk('h3','','Three purposes, in red frames'),u,mk('p','note','Also showing the boxes whose main lens is '+L+', and the arrows between them. Click a purpose to gather what leads into it.')])};
// theme
D.mod_order.forEach(k=>modSel.append(new Option(D.modules[k],k)));
modSel.onchange=()=>{ungather();const M=modSel.value;clearSels(modSel);if(!M){G.reset();hide();return}G.module(M);selTitle=D.modules[M];
  const core=D.nodes.filter(n=>n.mod===M).map(n=>n.id);
  show([mk('h3','',D.modules[M]),mk('p','note',core.length+' boxes in this theme, plus the boxes they connect to (grey dashed). Thick arrows stay inside the theme.'),list(core)])};
// product: the same boxes, turned up or down
Object.keys(D.products).forEach(k=>prodSel.append(new Option(k,k)));
prodSel.onchange=()=>{ungather();const k=prodSel.value;clearSels(prodSel);if(!k){G.reset();hide();return}const P=D.products[k];G.product(P);selTitle=k;
  show([mk('h3','',k),mk('p','ih','Turned up · red frames, red arrows to what they push'),list(P.high),mk('p','ih','Turned down · grey dashed frames'),list(P.low),
    mk('p','note','These are boxes every product shares. Another product turns the same boxes to different levels.')])};
// subsystem
D.subsystems.forEach((S,i)=>subSel.append(new Option(S.name,i)));
subSel.onchange=()=>{ungather();const v=subSel.value;clearSels(subSel);if(v===''){G.reset();hide();return}const S=D.subsystems[+v];G.subsystem(S);selTitle=S.name;
  show([mk('h3','',S.name),S.purpose.length?mk('p','ih','Its purpose · red frame'):mk('p','note','No purpose of its own in this diagram.'),list(S.purpose),
    mk('p','ih','Members ('+S.members.length+')'),list(S.members)])};
// find a box
findBox.addEventListener('input',()=>{ungather();const q=findBox.value.trim().toLowerCase();clearSels(findBox);if(!q){G.reset();hide();return}
  const hits=D.nodes.filter(n=>n.label.toLowerCase().includes(q)).map(n=>n.id);G.subset(hits);selTitle='Boxes matching '+findBox.value.trim();
  show([mk('p','ih',hits.length+(hits.length===1?' box matches':' boxes match')),list(hits)])});
findBox.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=findBox.value.trim().toLowerCase();const h=q&&D.nodes.find(n=>n.label.toLowerCase().includes(q));if(h)selectNode(h.id,true)});
document.getElementById('clear').onclick=()=>{ungather();clearSels(null);G.reset();hide()};
// the bar above the map follows the selection: grey line when nothing is picked, red bar with the button once something is
const selbar=document.getElementById('selbar'),selmsg=document.getElementById('selmsg');let lastSel='';
function syncBar(){const n=G.sel?G.sel.nodes.length:0;const on=n>0;selbar.classList.toggle('on',on);document.body.classList.toggle('hassel',on);
  if(!on){selmsg.textContent='Nothing selected yet.';lastSel='';return}
  selmsg.innerHTML='';const b=mk('b','',n+(n===1?' box':' boxes')+' selected');selmsg.append(b);if(selTitle)selmsg.append(mk('span','t',' · '+selTitle));
  const key=n+'|'+selTitle;if(key!==lastSel){lastSel=key;selbar.classList.remove('flash');void selbar.offsetWidth;selbar.classList.add('flash')}}
syncBar();
document.getElementById('soloBtn').onclick=()=>{if(!G.sel||!G.sel.nodes.length)return;
  openSolo(selTitle||'Selection',G.sel.nodes,G.sel.edges,G.sel.hl2,G.sel.sink)};
document.getElementById('soloClose').onclick=()=>document.getElementById('solo').classList.remove('on');
document.getElementById('solo').addEventListener('click',e=>{if(e.target.id==='solo')e.target.classList.remove('on')});
// color and legend
const leg=document.getElementById('legend');
function legend(mode){leg.innerHTML='';const ks=mode==='mod'?D.mod_order:LENS6;
  ks.forEach(k=>{const c=mode==='mod'?MC(k):css(k);const s=mk('span');const sw=mk('span','sw');sw.style.borderColor=c;sw.style.background=tint(c,.14);
    s.append(sw,document.createTextNode(mode==='mod'?D.modules[k]:k));leg.append(s)});
  leg.append(mk('span','','Thick frame: the purpose at the center · double frame: one of a lens’s three purposes · dashed: a setting the designer picks · dotted: a condition from outside · small dot: also in that lens'))}
legend('lens6');
document.querySelectorAll('input[name=cm]').forEach(r=>r.onchange=()=>{colorMode=r.value;G.color(r.value);legend(r.value)});
// zoom: pinch (phone, trackpad) or cmd-scroll, drag to pan, double-click, buttons, full screen
const natW=+svg.dataset.w;
const viewer=document.getElementById('viewer'),zl=document.getElementById('zlabel');
const touch=navigator.maxTouchPoints>0;
document.getElementById('zoomhint').textContent=touch?'Pinch to zoom · drag to move · tap a box':'Pinch or ⌘-scroll to zoom · drag to move · click a box';
let scale=1,autoFit=true;
const fitScale=()=>Math.max(0.05,(host.clientWidth-16)/natW);
function setScale(s,px,py){s=Math.min(3,Math.max(fitScale()*0.5,s));
  if(px==null){px=host.clientWidth/2;py=host.clientHeight/2}
  const cx=(host.scrollLeft+px)/scale,cy=(host.scrollTop+py)/scale;
  scale=s;svg.setAttribute('width',Math.round(natW*s));svg.setAttribute('height',Math.round(natW*s));
  host.scrollLeft=cx*s-px;host.scrollTop=cy*s-py;zl.textContent=Math.round(s*100)+'%'}
function centerOn(ids){const gs=ids.map(id=>{const o=G.geo[id],t=curTgt[id]||[0,0];return o&&{x:o.x+t[0],y:o.y+t[1],w:o.w,h:o.h}}).filter(Boolean);if(!gs.length)return;
  const x0=Math.min(...gs.map(o=>o.x-o.w/2)),x1=Math.max(...gs.map(o=>o.x+o.w/2)),y0=Math.min(...gs.map(o=>o.y-o.h/2)),y1=Math.max(...gs.map(o=>o.y+o.h/2));
  const vh=narrow()?host.clientHeight*.54:host.clientHeight;
  zoom(Math.max(scale,Math.min(1,(vh-80)/(y1-y0+1))));
  host.scrollLeft=(x0+x1)/2*scale-host.clientWidth/2;host.scrollTop=(y0+y1)/2*scale-vh/2}
const at=e=>{const r=host.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
const zoom=(s,x,y)=>{autoFit=false;setScale(s,x,y)};
host.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();const [x,y]=at(e);zoom(scale*Math.exp(-Math.max(-35,Math.min(35,e.deltaY))*0.012),x,y)},{passive:false});
// Safari trackpad pinch; on a touch screen the touch handlers below do the work
let gs0=1;
host.addEventListener('gesturestart',e=>{e.preventDefault();gs0=scale});
host.addEventListener('gesturechange',e=>{e.preventDefault();if(touch)return;const [x,y]=at(e);zoom(gs0*e.scale,x,y)});
// two-finger pinch: the point between the fingers stays under them while the map scales
let pinch=null;
const mid=t=>{const r=host.getBoundingClientRect();return [(t[0].clientX+t[1].clientX)/2-r.left,(t[0].clientY+t[1].clientY)/2-r.top]};
const span=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
host.addEventListener('touchstart',e=>{if(e.touches.length!==2)return;const [mx,my]=mid(e.touches);
  pinch={d:span(e.touches),s:scale,cx:(host.scrollLeft+mx)/scale,cy:(host.scrollTop+my)/scale}},{passive:true});
host.addEventListener('touchmove',e=>{if(!pinch||e.touches.length!==2)return;e.preventDefault();autoFit=false;
  const [mx,my]=mid(e.touches);const s=Math.min(3,Math.max(fitScale()*0.5,pinch.s*span(e.touches)/pinch.d));
  scale=s;svg.setAttribute('width',Math.round(natW*s));svg.setAttribute('height',Math.round(natW*s));
  host.scrollLeft=pinch.cx*s-mx;host.scrollTop=pinch.cy*s-my;zl.textContent=Math.round(s*100)+'%'},{passive:false});
host.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null});
host.addEventListener('touchcancel',()=>{pinch=null});
let drag=null,moved=false;
host.addEventListener('mousedown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,sl:host.scrollLeft,st:host.scrollTop};moved=false});
window.addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){moved=true;host.classList.add('grabbing')}host.scrollLeft=drag.sl-dx;host.scrollTop=drag.st-dy});
window.addEventListener('mouseup',()=>{drag=null;host.classList.remove('grabbing')});
host.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
host.addEventListener('dblclick',e=>{e.preventDefault();const [x,y]=at(e);zoom(scale*1.7,x,y)});
document.getElementById('zin').onclick=()=>zoom(scale*1.4);
document.getElementById('zout').onclick=()=>zoom(scale/1.4);
document.getElementById('zfit').onclick=()=>{autoFit=true;setScale(fitScale());host.scrollLeft=0;host.scrollTop=0};
document.getElementById('z100').onclick=()=>zoom(1);
const fsb=document.getElementById('zfs');
function fs(on){viewer.classList.toggle('fs',on);fsb.textContent=on?'Exit full screen':'Full screen'}
fsb.onclick=()=>fs(!viewer.classList.contains('fs'));
window.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const so=document.getElementById('solo');if(so.classList.contains('on')){so.classList.remove('on');return}if(viewer.classList.contains('fs'))fs(false)});
// refit while the viewer changes size (window, full screen, phone turned) until someone zooms by hand
new ResizeObserver(()=>{if(autoFit){setScale(fitScale());host.scrollLeft=0;host.scrollTop=0}else setScale(scale)}).observe(host);
// hover notes (mouse only): anything with data-tip shows a small note next to the pointer
const tip=mk('div','tip');document.body.append(tip);let tipOn=null;
document.addEventListener('mouseover',e=>{if(touch&&e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents)return;
  const t=e.target.closest?e.target.closest('[data-tip]'):null;if(t===tipOn)return;tipOn=t;
  if(!t){tip.classList.remove('on');return}tip.textContent=t.getAttribute('data-tip');tip.classList.add('on')});
document.addEventListener('mousemove',e=>{if(!tipOn)return;if(drag&&moved){tip.classList.remove('on');return}
  const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+18;if(x+w>innerWidth-8)x=e.clientX-w-12;if(y+h>innerHeight-8)y=e.clientY-h-12;
  tip.style.left=x+'px';tip.style.top=y+'px'});
document.addEventListener('touchstart',()=>{tipOn=null;tip.classList.remove('on')},{passive:true});
const TIPS={zout:'Zoom out',zin:'Zoom in',zfit:'Fit the whole map to the width',z100:'Actual size',zfs:'Fill the screen (Esc to leave)',
  clear:'Clear any selection and show every box',soloBtn:'Lay out what is selected as a small diagram, left to right',lensSel:'Show one lens; its three purposes get red frames',modSel:'Show one theme and the boxes it connects to',
  prodSel:'Show which boxes one product turns up or down',subSel:'Show one group of players and its purpose',
  find:'Type part of a box name; Enter jumps to the first match',infoX:'Close this box'};
Object.entries(TIPS).forEach(([id,t])=>document.getElementById(id).setAttribute('data-tip',t));
</script></body></html>
